name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  PNPM_VERSION: 10.30.3

jobs:
  web-checks:
    name: web / lint, typecheck, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pulse/web lint
      - run: pnpm --filter @pulse/web typecheck
      - run: pnpm --filter @pulse/web test

  api-unit:
    name: api / unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: apps/api
        run: |
          pip install -e ".[dev]"
          ruff check src tests
          mypy src
          pytest tests/unit -v

  api-integration:
    name: api / integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: apps/api
        run: |
          pip install -e ".[dev]"
          pytest tests/integration -v

  contract:
    name: contract / consumer + provider verification
    runs-on: ubuntu-latest
    needs: [web-checks, api-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile
      - name: Generate pact from the web consumer test
        run: pnpm --filter @pulse/web pact:consumer

      - name: Start API against an ephemeral Postgres
        working-directory: apps/api
        run: |
          pip install -e ".[dev]"
          docker compose -f ../../docker-compose.yml up -d --wait postgres
          alembic upgrade head
          nohup uvicorn pulse_api.interface.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 20); do curl -sf http://localhost:8000/health && break; sleep 1; done

      - name: Verify the provider honours the consumer contract
        working-directory: apps/api
        run: pytest tests/contract -v

  e2e:
    name: e2e / Playwright happy path
    runs-on: ubuntu-latest
    needs: [web-checks, api-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pulse/web exec playwright install --with-deps chromium

      - name: Start the API against an ephemeral Postgres
        working-directory: apps/api
        run: |
          pip install -e ".[dev]"
          docker compose -f ../../docker-compose.yml up -d --wait postgres
          alembic upgrade head
          nohup uvicorn pulse_api.interface.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 20); do curl -sf http://localhost:8000/health && break; sleep 1; done

      - name: Build and start the web app
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          pnpm build
          nohup pnpm start &
          for i in $(seq 1 20); do curl -sf http://localhost:3000 && break; sleep 1; done

      - name: Run Playwright
        working-directory: apps/web
        env:
          CI: "true"
        run: pnpm test:e2e
